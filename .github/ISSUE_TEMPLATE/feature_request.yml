name: Feature request
description: Propose a focused product improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same proposal.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mac app
        - Harness or conversation
        - Linux host or remote workspace
        - Library sync or device pairing
        - Bots
        - Executor apps
        - Browser or Computer Use
        - iPhone app (beta)
        - Maintainer tooling or documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should WovenMatter solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and its local or remote scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Scope and tradeoffs
      description: What should this proposal deliberately not do, and what tradeoffs does it introduce?
