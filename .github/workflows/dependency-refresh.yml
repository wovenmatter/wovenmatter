name: Dependency refresh

# Resolve and build candidates without repository write credentials; a separate
# job publishes the resulting patch as a proposal. Never merges or releases.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      include_majors:
        description: Propose newer major lines too (the daily schedule always does)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dependency-refresh
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare current dependency proposal
    if: github.repository == 'wovenmatter/wovenmatter' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.proposal.outputs.changed }}
      artifact: ${{ steps.proposal.outputs.artifact }}
    steps:
      # Security-critical proposal pipeline: released SHAs, refreshed by Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: default-agent/.node-version
      - name: Select current stable source dependencies
        env:
          # Read-only metadata token; dependency code never gets a write token.
          GH_TOKEN: ${{ github.token }}
          INCLUDE_MAJORS: ${{ github.event_name == 'schedule' || inputs.include_majors }}
        run: |
          args=(--write --report "$RUNNER_TEMP/dependency-report.md")
          if [ "$INCLUDE_MAJORS" = true ]; then args+=(--include-majors); fi
          node scripts/update-runtime-dependencies.mjs "${args[@]}"
          cat "$RUNNER_TEMP/dependency-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage the proposal
        id: proposal
        run: |
          git add --all
          if git diff --cached --name-only | grep -E '^\.github/'; then
            echo '::error::Dependency refresh must not edit workflows or release requests.' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Coordinated dependency records are current.' >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --cached --binary > "$RUNNER_TEMP/dependency.patch"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "artifact=dependency-proposal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.proposal.outputs.changed == 'true'
        with:
          name: ${{ steps.proposal.outputs.artifact }}
          path: |
            ${{ runner.temp }}/dependency.patch
            ${{ runner.temp }}/dependency-report.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Propose candidate and request CI
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # This job never installs or executes the candidate's dependency code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download this run's proposal
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_ARTIFACT: ${{ needs.prepare.outputs.artifact }}
        run: gh run download "$GITHUB_RUN_ID" --name "$PROPOSAL_ARTIFACT" --dir "$RUNNER_TEMP/proposal"
      - name: Publish the candidate branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          # Reserved exclusively for this workflow.
          BRANCH: codex/dependency-refresh
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/proposal/dependency.patch"
          if git diff --cached --name-only | grep -E '^\.github/'; then
            echo '::error::Dependency refresh must not edit workflows or release requests.' >&2
            exit 1
          fi
          open_pr="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"

          # An absent branch is allowed; a failed remote query is not.
          wm_ref_status=0
          git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > "$RUNNER_TEMP/candidate-ref" || wm_ref_status=$?
          case "$wm_ref_status" in
            0) candidate="$(cut -f1 "$RUNNER_TEMP/candidate-ref")" ;;
            2) candidate= ;;
            *) exit "$wm_ref_status" ;;
          esac
          [ -z "$candidate" ] || git fetch --quiet --no-tags origin "$candidate"

          # Identical trees reuse the actual remote commit across retries.
          if [ -n "$candidate" ] && git diff --cached --quiet "$candidate"; then
            head="$candidate"
            echo "Candidate $head already contains this proposal." >> "$GITHUB_STEP_SUMMARY"
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m 'Refresh coordinated runtime dependencies' -m "Generated by dependency-refresh.yml run $GITHUB_RUN_ID."
            git push --force-with-lease="refs/heads/$BRANCH:$candidate" origin "HEAD:refs/heads/$BRANCH"
            head="$(git rev-parse HEAD)"
          fi

          title='Refresh coordinated runtime dependencies'
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "$title" --body-file "$RUNNER_TEMP/proposal/dependency-report.md"
          elif ! gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/proposal/dependency-report.md"; then
            echo "::error::$BRANCH holds the candidate, but GitHub rejected opening its pull request. Repository workflow permissions may not allow bot-created PRs; the owner can allow that or open this candidate manually, then rerun." >&2
            exit 1
          fi

          # GITHUB_TOKEN-created PRs do not start pull_request workflows. Retry
          # a missing dispatch, while retaining existing runs and their results.
          runs="$(gh run list --workflow ci.yml --commit "$head" --limit 1 --json databaseId --jq 'length')"
          if [ "$runs" = 0 ]; then
            gh workflow run ci.yml --ref "$BRANCH"
            echo "Started CI for $head; review and merge manually after it passes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CI already has a run for $head." >> "$GITHUB_STEP_SUMMARY"
          fi
