name: CI

# One portable Linux check: static checks, the server package's tests (which
# build protocol/ and library/ too) and the Node children's tests. No
# provider, release, deployment or signing credentials.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # The Swift release recorded in server/linux-build.json.
    container: swift:6.4.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev python3 >/dev/null
      - uses: actions/setup-node@main
        with:
          node-version-file: default-agent/.node-version
      - name: Reuse the Swift build
        uses: actions/cache@main
        with:
          path: server/.build
          key: swift-${{ runner.os }}-${{ hashFiles('server/Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-${{ runner.os }}-${{ hashFiles('server/Package.resolved') }}-
      - name: Test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/test-changes.sh --ci
