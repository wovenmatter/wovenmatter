name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
      desktop: ${{ steps.paths.outputs.desktop }}
      remote: ${{ steps.paths.outputs.remote }}
      ios: ${{ steps.paths.outputs.ios }}
      companion: ${{ steps.paths.outputs.companion }}
      updates: ${{ steps.paths.outputs.updates }}
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          node-version-file: default-agent/.node-version
          cache: npm
          cache-dependency-path: default-agent/package-lock.json
      - name: Select focused validation
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$ALL" = true ]; then
            git ls-files > "$RUNNER_TEMP/changed-files"
          else
            # Fetch just the two immutable trees, rather than the entire history.
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              git ls-files > "$RUNNER_TEMP/changed-files"
            else
              git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
              git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            fi
          fi
          python3 scripts/ci-scopes.py < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"
      - name: Run portable validation once
        run: scripts/test-ci.sh --files "$RUNNER_TEMP/changed-files"

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      WOVENMATTER_TEST_CACHE_DIR: /private/tmp/wovenmatter-ci
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          # The bundled Node stable release, refreshed during dependency maintenance.
          node-version-file: default-agent/.node-version
          cache: npm
          cache-dependency-path: default-agent/package-lock.json
      - name: Ensure CEF build tools
        run: command -v cmake >/dev/null || brew install cmake

      - name: Identify native toolchain
        id: toolchain
        run: |
          { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; cmake --version; } |
            shasum -a 256 | awk '{print "key=" $1}' >> "$GITHUB_OUTPUT"
      - name: Reuse native build intermediates
        uses: actions/cache@main
        with:
          path: |
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/SwiftPM
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/ModuleCache
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/DerivedData/Build/Intermediates.noindex
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/DerivedData/SourcePackages
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/SharedSwiftPM
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/Integration
            ~/Library/Caches/WovenMatter/Downloads
          key: native-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('app/Package.resolved', 'app/Package.swift', 'shared/Package.swift', 'integration/Package.swift', 'app/Browser/cef-version.json', 'default-agent/package-lock.json') }}-${{ github.sha }}
          restore-keys: native-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('app/Package.resolved', 'app/Package.swift', 'shared/Package.swift', 'integration/Package.swift', 'app/Browser/cef-version.json', 'default-agent/package-lock.json') }}-
      - name: Test native desktop
        if: needs.changes.outputs.desktop == 'true'
        shell: bash
        run: |
          mkdir -p "$WOVENMATTER_TEST_CACHE_DIR"
          scripts/test-changes.sh --native 2>&1 | tee "$WOVENMATTER_TEST_CACHE_DIR/desktop.log"
      - name: Test companion integration on the same runner
        if: needs.changes.outputs.companion == 'true'
        shell: bash
        run: |
          mkdir -p "$WOVENMATTER_TEST_CACHE_DIR"
          scripts/test-changes.sh --companion-desktop 2>&1 | tee "$WOVENMATTER_TEST_CACHE_DIR/companion.log"
      - name: Verify signed delta round trip
        if: needs.changes.outputs.updates == 'true'
        run: python3 scripts/test-delta-updates.py
      - name: Preserve desktop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: desktop-results-${{ github.run_attempt }}
          path: |
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/*.log
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/embedded-runtime-report.json
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS (${{ matrix.device }})
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    env:
      WOVENMATTER_IOS_TEST_CACHE_DIR: /private/tmp/wovenmatter-ios-${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        # One simulator on PRs; manual full validation also covers iPad.
        device: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["iPhone", "iPad"]') || fromJSON('["iPhone"]') }}
    steps:
      - uses: actions/checkout@main
      - name: Identify mobile toolchain
        id: toolchain
        run: xcodebuild -version | shasum -a 256 | awk '{print "key=" $1}' >> "$GITHUB_OUTPUT"
      - name: Reuse mobile build intermediates
        uses: actions/cache@main
        with:
          path: |
            ${{ env.WOVENMATTER_IOS_TEST_CACHE_DIR }}/package
            ${{ env.WOVENMATTER_IOS_TEST_CACHE_DIR }}/modules
            ${{ env.WOVENMATTER_IOS_TEST_CACHE_DIR }}/xcode/Build/Intermediates.noindex
            ${{ env.WOVENMATTER_IOS_TEST_CACHE_DIR }}/xcode/SourcePackages
          key: ios-v1-${{ runner.arch }}-${{ matrix.device }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('ios/Package.swift', 'shared/Package.swift', 'ios/WovenMatterCompanion.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: ios-v1-${{ runner.arch }}-${{ matrix.device }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('ios/Package.swift', 'shared/Package.swift', 'ios/WovenMatterCompanion.xcodeproj/project.pbxproj') }}-
      - name: Test native mobile flows
        env:
          WOVENMATTER_IOS_SIMULATOR_DEVICE_TYPE: ${{ matrix.device == 'iPhone' && 'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro' || 'com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB' }}
        run: scripts/test-ios.sh --ui
      - name: Preserve mobile test results
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: ios-results-${{ matrix.device }}-${{ github.run_attempt }}
          path: ${{ env.WOVENMATTER_IOS_TEST_CACHE_DIR }}/results.*
          if-no-files-found: warn
          retention-days: 7

  remote:
    name: Remote workspace (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.remote == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          # The bundled Node stable release, refreshed during dependency maintenance.
          node-version-file: default-agent/.node-version
      - name: Build the remote workspace image
        run: docker build --pull --no-cache --file remote/Dockerfile --tag wovenmatter-remote:ci --tag wovenmatter/workspace:latest .

      - name: Verify workspace isolation and home preservation
        run: scripts/test-container.sh --skip-build

      - name: Build the standalone Executor runtime
        run: |
          wm_executor_version="$(node --input-type=module -e 'import { latestExecutorVersion } from "./default-agent/src/executor/broker.mjs"; console.log(await latestExecutorVersion());')"
          docker build --pull --no-cache --build-arg "EXECUTOR_VERSION=$wm_executor_version" \
            --file remote/Executor.Dockerfile --tag wovenmatter-executor:ci remote
      - name: Verify Executor native helper prerequisites
        run: |
          docker run --rm --entrypoint bash \
            --mount "type=bind,src=$PWD/scripts/test-support/test-executor-image.sh,dst=/tmp/test-executor-image.sh,readonly" \
            wovenmatter-executor:ci /tmp/test-executor-image.sh
      - name: Verify unchanged Executor scopes, approvals and cancellation in Linux
        run: |
          npm ci --prefix default-agent --omit=dev --ignore-scripts --no-audit --no-fund
          docker run --rm --entrypoint node --volume "$PWD:/workspace:ro" \
            wovenmatter-executor:ci /workspace/scripts/test-support/test-executor-runtime.mjs \
            /opt/executor/node_modules/executor/bin.mjs
      - name: Record complete image vulnerability inventory
        if: matrix.platform == 'amd64'
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/trivy-reports"
          for image in workspace executor; do
            if [ "$image" = workspace ]; then tag=wovenmatter-remote:ci; else tag=wovenmatter-executor:ci; fi
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              --volume "$RUNNER_TEMP/trivy-reports:/reports" \
              "$TRIVY_IMAGE" image --scanners vuln --format json \
              --output "/reports/$image.json" "$tag"
          done
          python3 scripts/test-support/summarize-trivy.py \
            "$RUNNER_TEMP/trivy-reports/workspace.json" \
            "$RUNNER_TEMP/trivy-reports/executor.json" | tee "$RUNNER_TEMP/trivy-reports/summary.jsonl"
      - name: Preserve image vulnerability inventory
        if: always() && matrix.platform == 'amd64'
        uses: actions/upload-artifact@main
        with:
          name: remote-image-vulnerability-inventory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy-reports/*
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI
    needs: [changes, macos, ios, remote]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require relevant validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          REMOTE_RESULT: ${{ needs.remote.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$MACOS_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$IOS_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$REMOTE_RESULT" in success|skipped) ;; *) exit 1 ;; esac
