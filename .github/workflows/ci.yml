name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
      remote: ${{ steps.paths.outputs.remote }}
      ios: ${{ steps.paths.outputs.ios }}
      companion: ${{ steps.paths.outputs.companion }}
      updates: ${{ steps.paths.outputs.updates }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Scan the public tree
        run: scripts/scan-public-tree.sh

      - name: Select focused validation
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base_sha="$BASE_SHA"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse "${HEAD_SHA}^")"
          fi

          git diff --name-only "$base_sha" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"

          python3 scripts/test-support/test_ci_scopes.py
          python3 scripts/ci-scopes.py < "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    # Cold desktop builds and companion integration have a separate budget from UI tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          # The bundled Node stable release, refreshed during dependency maintenance.
          node-version-file: default-agent/.node-version
      - name: Ensure CEF build tools
        run: command -v cmake >/dev/null || brew install cmake

      - name: Test desktop
        shell: bash
        env:
          WOVENMATTER_TEST_CACHE_DIR: ${{ runner.temp }}/wovenmatter-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$WOVENMATTER_TEST_CACHE_DIR"
          scripts/test-changes.sh --desktop 2>&1 | tee "$WOVENMATTER_TEST_CACHE_DIR/desktop.log"
      - name: Preserve desktop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: desktop-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wovenmatter-ci-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/wovenmatter-ci-${{ github.run_id }}-${{ github.run_attempt }}/embedded-runtime-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify signed delta round trip
        if: needs.changes.outputs.updates == 'true'
        run: python3 scripts/test-delta-updates.py

  companion:
    name: Companion runtime integration
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          # The bundled Node stable release, refreshed during dependency maintenance.
          node-version-file: default-agent/.node-version
      - name: Test companion protocol and runtime integration
        env:
          WOVENMATTER_TEST_CACHE_DIR: ${{ runner.temp }}/wovenmatter-companion-${{ github.run_id }}-${{ github.run_attempt }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
        run: |
          if [ "$IOS_CHANGED" = true ]; then
            scripts/test-changes.sh --companion
          else
            scripts/test-changes.sh --companion-desktop
          fi

  ios:
    name: iOS UI (${{ matrix.device.name }})
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: iPhone
            type: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          - name: iPad
            type: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB
    steps:
      - uses: actions/checkout@main
      - name: Test native mobile flows
        env:
          WOVENMATTER_IOS_TEST_CACHE_DIR: ${{ runner.temp }}/wovenmatter-ios-${{ github.run_id }}-${{ github.run_attempt }}
          WOVENMATTER_IOS_SIMULATOR_DEVICE_TYPE: ${{ matrix.device.type }}
        run: scripts/test-ios.sh --ui
      - name: Preserve mobile test results
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: ios-results-${{ matrix.device.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wovenmatter-ios-${{ github.run_id }}-${{ github.run_attempt }}/results.*
          if-no-files-found: warn
          retention-days: 7

  remote:
    name: Remote workspace (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.remote == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          # The bundled Node stable release, refreshed during dependency maintenance.
          node-version-file: default-agent/.node-version
      - name: Run deterministic remote validation
        run: scripts/test-changes.sh --remote
      - name: Build the remote workspace image
        run: docker build --pull --no-cache --file remote/Dockerfile --tag wovenmatter-remote:ci --tag wovenmatter/workspace:latest .

      - name: Verify workspace isolation and home preservation
        run: scripts/test-container.sh --skip-build

      - name: Build the standalone Executor runtime
        run: |
          wm_executor_version="$(node --input-type=module -e 'import { latestExecutorVersion } from "./default-agent/src/executor/broker.mjs"; console.log(await latestExecutorVersion());')"
          docker build --pull --no-cache --build-arg "EXECUTOR_VERSION=$wm_executor_version" \
            --file remote/Executor.Dockerfile --tag wovenmatter-executor:ci remote
      - name: Verify Executor native helper prerequisites
        run: |
          docker run --rm --entrypoint bash wovenmatter-executor:ci -ec '
            test -s /etc/ssl/certs/ca-certificates.crt
            test "$(id -u)" -ne 0
            dpkg --compare-versions "$(dpkg-query -W -f=\${Version} curl)" ge 8.21.0
            dpkg --compare-versions "$(dpkg-query -W -f=\${Version} libacl1)" ge 2.4.0-1+wmsecurity1
            dpkg --compare-versions "$(dpkg-query -W -f=\${Version} libtinfo6)" ge 6.5+20250216-2+wmsecurity1
            dpkg --compare-versions "$(dpkg-query -W -f=\${Version} util-linux)" ge 2.41.5-0+deb13u1+wmsecurity1
            perl -MArchive::Tar -e "exit(Archive::Tar->VERSION ge q(3.14) ? 0 : 1)"
            npm --version | awk -F. '$1 > 12 || ($1 == 12 && $2 >= 2) { ok=1 } END { exit !ok }'
            node -e 'const {createRequire}=require("node:module"); const npm=createRequire("/usr/local/lib/node_modules/npm/package.json"); if(npm("undici/package.json").version!=="8.12.3"||npm("ip-address/package.json").version!=="10.7.5")process.exit(1)'
            runtime_modules="$(find /opt/executor/node_modules -type d -path '*/runtime/node_modules' -print -quit)"
            node -e 'const sharp=require(process.argv[1]); if(sharp.versions.sharp!=="0.35.5"||sharp.versions.rsvg!=="2.63.2")process.exit(1)' "$runtime_modules/sharp"
            test -z "$(find /usr -xdev -type f -perm /6000 -print -quit)"
            wm_helpers=0
            while IFS= read -r -d "" wm_helper; do
              "$wm_helper" --version
              wm_helpers=$((wm_helpers+1))
            done < <(find /opt/executor -type f \( -path "*/git/bin/git" -o -path "*/bin/workerd" \) -print0)
            test "$wm_helpers" -ge 2
          '
      - name: Verify unchanged Executor scopes, approvals and cancellation in Linux
        run: |
          npm ci --prefix default-agent --omit=dev --ignore-scripts --no-audit --no-fund
          docker run --rm --entrypoint node --volume "$PWD:/workspace:ro" \
            wovenmatter-executor:ci /workspace/scripts/test-support/test-executor-runtime.mjs \
            /opt/executor/node_modules/executor/bin.mjs

  gate:
    name: CI
    needs: [changes, macos, companion, ios, remote]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require relevant validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          COMPANION_RESULT: ${{ needs.companion.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          REMOTE_RESULT: ${{ needs.remote.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$MACOS_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$COMPANION_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$IOS_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          case "$REMOTE_RESULT" in success|skipped) ;; *) exit 1 ;; esac
