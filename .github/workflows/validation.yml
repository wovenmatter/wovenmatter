name: Manual validation
# The release gate (scripts/check-release-validation.py) reads the scope from this title.
run-name: Manual validation (${{ inputs.scope }})

# Expensive platform validation runs only when a maintainer requests it, on the
# owned runners (docs/CI_RUNNERS.md): wovenmatter-linux is Trey's workstation and
# wovenmatter-macos is his Mac mini. Caches persist on those machines, apart from
# release caches and from the user's own dev builds (scripts/ci-runner/cache-env.sh).
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation to run
        type: choice
        required: true
        default: all
        options: [all, desktop, mobile, images, linux]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false

jobs:
  portable:
    name: All portable checks
    if: inputs.scope == 'all'
    runs-on: [self-hosted, wovenmatter-linux]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@main
      - name: Use this runner's validation caches
        run: scripts/ci-runner/cache-env.sh validation >> "$GITHUB_ENV"
      - uses: actions/setup-node@main
        with:
          node-version-file: default-agent/.node-version
      - run: scripts/test-ci.sh --all

  macos:
    name: macOS
    if: inputs.scope == 'all' || inputs.scope == 'desktop'
    # The Xcode recorded in app/xcode-version.json, on the owned Mac.
    runs-on: [self-hosted, wovenmatter-macos]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@main
      - name: Require the recorded Xcode
        run: scripts/check-xcode.sh
      # Build intermediates stay on the Mac between runs.
      - name: Use this runner's validation caches
        run: scripts/ci-runner/cache-env.sh validation >> "$GITHUB_ENV"
      - name: Clear the previous run's diagnostics
        run: rm -f "$WOVENMATTER_TEST_CACHE_DIR"/*.log "$WOVENMATTER_TEST_CACHE_DIR/embedded-runtime-report.json"
      - uses: actions/setup-node@main
        with:
          # The bundled Node stable release, refreshed during dependency maintenance.
          node-version-file: default-agent/.node-version
      - name: Ensure CEF build tools
        run: command -v cmake >/dev/null || { echo '::error::Install cmake on this runner (brew install cmake).'; exit 1; }

      - name: Test native desktop
        shell: bash
        run: |
          mkdir -p "$WOVENMATTER_TEST_CACHE_DIR"
          scripts/test-changes.sh --native 2>&1 | tee "$WOVENMATTER_TEST_CACHE_DIR/desktop.log"
      - name: Test cross-device integration on the same runner
        shell: bash
        run: |
          mkdir -p "$WOVENMATTER_TEST_CACHE_DIR"
          scripts/test-changes.sh --cross-device-desktop 2>&1 | tee "$WOVENMATTER_TEST_CACHE_DIR/cross-device.log"
      - name: Verify signed full-only update round trip
        run: python3 scripts/test-full-updates.py
      - name: Preserve desktop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: desktop-results-${{ github.run_attempt }}
          path: |
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/*.log
            ${{ env.WOVENMATTER_TEST_CACHE_DIR }}/embedded-runtime-report.json
          if-no-files-found: warn
          retention-days: 7

  linux-library:
    name: Linux library
    if: inputs.scope == 'all' || inputs.scope == 'linux'
    runs-on: [self-hosted, wovenmatter-linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - name: Use this runner's validation caches
        run: scripts/ci-runner/cache-env.sh validation >> "$GITHUB_ENV"
      # Both steps run in the pinned Swift image (remote/library/build-version.json).
      - name: Build and test the portable Swift targets on Linux
        run: scripts/test-linux-library.sh
      - name: Build the static wovenmatter-library for amd64 and arm64
        run: scripts/build-linux-library.sh --docker
      - name: Preserve the Linux library binaries
        uses: actions/upload-artifact@main
        with:
          name: wovenmatter-library-linux-${{ github.run_attempt }}
          path: remote/host/library/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (${{ matrix.device }})
    if: inputs.scope == 'all' || inputs.scope == 'mobile'
    # The owned Mac runs one job at a time, so the two devices run in turn.
    runs-on: [self-hosted, wovenmatter-macos]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@main
      - name: Require the recorded Xcode
        run: scripts/check-xcode.sh
      - name: Use this runner's validation caches
        run: scripts/ci-runner/cache-env.sh validation >> "$GITHUB_ENV"
      - name: Use this device's mobile cache and clear its previous results
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          echo "WOVENMATTER_IOS_TEST_CACHE_DIR=$WOVENMATTER_CI_CACHE_ROOT/IOS-$DEVICE" >> "$GITHUB_ENV"
          rm -f "$WOVENMATTER_CI_CACHE_ROOT/IOS-$DEVICE"/results.*
      - name: Test native mobile flows
        env:
          WOVENMATTER_IOS_SIMULATOR_DEVICE_TYPE: ${{ matrix.device == 'iPhone' && 'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro' || 'com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB' }}
        run: scripts/test-ios.sh --ui
      - name: Preserve mobile test results
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: ios-results-${{ matrix.device }}-${{ github.run_attempt }}
          path: ${{ env.WOVENMATTER_IOS_TEST_CACHE_DIR }}/results.*
          if-no-files-found: warn
          retention-days: 7

  # Stays on GitHub's runners: arm64 needs arm64 Linux hardware, and the job
  # tags images (wovenmatter/workspace:latest) a shared Docker host would also see.
  remote:
    name: Remote workspace (${{ matrix.platform }})
    if: inputs.scope == 'all' || inputs.scope == 'images'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@main
        with:
          # The bundled Node stable release, refreshed during dependency maintenance.
          node-version-file: default-agent/.node-version
      - name: Build the remote workspace image
        run: docker build --pull --no-cache --file remote/Dockerfile --tag wovenmatter-remote:ci --tag wovenmatter/workspace:latest .

      - name: Verify workspace isolation and home preservation
        run: scripts/test-container.sh --skip-build

      - name: Build the standalone Executor runtime
        run: |
          # The version comes from the broker, which imports default-agent's packages.
          npm ci --prefix default-agent --omit=dev --ignore-scripts --no-audit --no-fund
          wm_executor_version="$(node --input-type=module -e 'import { latestExecutorVersion } from "./default-agent/src/executor/broker.mjs"; console.log(await latestExecutorVersion());')"
          docker build --pull --no-cache --build-arg "EXECUTOR_VERSION=$wm_executor_version" \
            --file remote/Executor.Dockerfile --tag wovenmatter-executor:ci remote
      - name: Verify Executor native helper prerequisites
        run: |
          docker run --rm --entrypoint bash \
            --mount "type=bind,src=$PWD/scripts/test-support/test-executor-image.sh,dst=/tmp/test-executor-image.sh,readonly" \
            wovenmatter-executor:ci /tmp/test-executor-image.sh
      - name: Verify unchanged Executor scopes, approvals and cancellation in Linux
        run: |
          docker run --rm --entrypoint node --volume "$PWD:/workspace:ro" \
            wovenmatter-executor:ci /workspace/scripts/test-support/test-executor-runtime.mjs \
            /opt/executor/native/executor
      - name: Record complete image vulnerability inventory
        if: matrix.platform == 'amd64'
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/trivy-reports"
          for image in workspace executor; do
            if [ "$image" = workspace ]; then tag=wovenmatter-remote:ci; else tag=wovenmatter-executor:ci; fi
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              --volume "$RUNNER_TEMP/trivy-reports:/reports" \
              "$TRIVY_IMAGE" image --scanners vuln --format json \
              --output "/reports/$image.json" "$tag"
          done
          python3 scripts/test-support/summarize-trivy.py \
            "$RUNNER_TEMP/trivy-reports/workspace.json" \
            "$RUNNER_TEMP/trivy-reports/executor.json" | tee "$RUNNER_TEMP/trivy-reports/summary.jsonl"
      - name: Preserve image vulnerability inventory
        if: always() && matrix.platform == 'amd64'
        uses: actions/upload-artifact@main
        with:
          name: remote-image-vulnerability-inventory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy-reports/*
          if-no-files-found: warn
          retention-days: 7
