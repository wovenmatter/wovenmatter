name: Manual validation

# Expensive platform validation runs only when a maintainer requests it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Desktop updates
    # Xcode 27.2, the toolchain the app is developed and released with (macos-26 stops at 26.6).
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@main
      - name: Verify signed full-only update round trip
        run: python3 scripts/test-full-updates.py
