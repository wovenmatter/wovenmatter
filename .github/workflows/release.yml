name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh the existing public release from an accepted immutable build tag
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-publication
  cancel-in-progress: false

jobs:
  macos:
    name: Signed Apple Silicon release
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    steps:
      # Signing secrets and release write access: exact current releases,
      # reviewed during dependency maintenance (docs/DEPENDENCIES.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The bundled Node stable release, refreshed during dependency maintenance.
          node-version-file: default-agent/.node-version

      - name: Verify accepted release source
        id: source
        env:
          REFRESH: ${{ inputs.refresh || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "$REFRESH" = true ]; then
            scripts/verify-update-request.sh
            version="$(jq -er '.version' .github/release-refresh.json)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            build="$(git rev-list --count HEAD)"
            test "$GITHUB_REF_NAME" = "v${version}-build${build}"
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v$version"
            gh release view "v$version" --json isDraft --jq .isDraft | grep -qx false
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --jq '.immutable == false' | grep -qx true
          else
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
            version="${GITHUB_REF_NAME#v}"
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata before compiling
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: python3 scripts/validate-release-metadata.py preflight "$VERSION" "$(git rev-list --count HEAD)" "$GITHUB_SHA"

      - name: Ensure CEF build tools
        run: command -v cmake >/dev/null || brew install cmake

      - name: Identify exact dependency and toolchain inputs
        id: cache-inputs
        run: scripts/release-cache-key.sh >> "$GITHUB_OUTPUT"

      # Read-only: only the manual main-branch cache workflow saves release inputs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; exact release for release caches
        with:
          path: |
            ~/Library/Caches/WovenMatter/Downloads
            ~/Library/Caches/WovenMatter/BrowserBuilds
            ~/Library/Caches/WovenMatter/SourcePackages/repositories
            ~/.npm
          key: ${{ steps.cache-inputs.outputs.key }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; exact release for release caches
        with:
          path: ~/Library/Caches/WovenMatter/Compiler
          key: compiler-v1-${{ steps.cache-inputs.outputs.key }}-${{ github.sha }}
          restore-keys: compiler-v1-${{ steps.cache-inputs.outputs.key }}-

      - name: Record available completed main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse exact-source evidence; never trigger or wait for source tests here.
          if ci_url="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --event push --branch main --commit "$GITHUB_SHA" --status success \
            --limit 1 --json url --jq '.[0].url // empty')" && [ -n "$ci_url" ]; then
            echo "Completed exact-source main CI: $ci_url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No completed CI metadata available for the accepted source." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Import Developer ID identity
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/wovenmatter-release.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Prepare notarization key
        env:
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-private-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-private-key.p8"

      - name: Prepare update signing key and published delta bases
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"
          python3 scripts/prepare-update-history.py "$RUNNER_TEMP/update-history"

      - name: Build, sign, notarize, and package
        env:
          WOVENMATTER_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WOVENMATTER_SIGNING_IDENTITY: Developer ID Application
          WOVENMATTER_NOTARY_KEY: ${{ runner.temp }}/notary-private-key.p8
          WOVENMATTER_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          WOVENMATTER_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          WOVENMATTER_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/dist
          WOVENMATTER_RELEASE_ALLOW_UNTAGGED: ${{ inputs.refresh && '1' || '0' }}
          WOVENMATTER_SPARKLE_PRIVATE_KEY: ${{ runner.temp }}/sparkle-private-key
          WOVENMATTER_UPDATE_HISTORY: ${{ runner.temp }}/update-history
          REFRESH: ${{ inputs.refresh || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          restore=--restore-tagged
          if [ "$REFRESH" = true ]; then restore=--restore-staged; fi
          if python3 scripts/stage-update.py dist "${{ steps.source.outputs.version }}" "$restore"; then
            echo "Reusing the original verified private artifacts for this build."
            exit 0
          else
            status=$?
            test "$status" -eq 3 || exit "$status"
          fi
          WOVENMATTER_RELEASE_WORK_DIR=/private/tmp/wovenmatter-release-build \
          WOVENMATTER_COMPILER_CACHE="$HOME/Library/Caches/WovenMatter/Compiler" \
          WOVENMATTER_PACKAGE_CACHE="$HOME/Library/Caches/WovenMatter/SourcePackages" scripts/build-release.sh "${{ steps.source.outputs.version }}"

      - name: Verify private draft and deliver authorized update refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh || false }}
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_SPARKLE_PRIVATE_KEY: ${{ runner.temp }}/sparkle-private-key
        run: |
          if [ "$REFRESH" != true ] && ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --title "Woven Matter v$VERSION" \
              --notes "Signed and notarized Apple Silicon release."
          fi
          options=()
          if [ "$REFRESH" = true ]; then options+=(--refresh); fi
          python3 scripts/stage-update.py dist "$VERSION" "${options[@]}"

      - name: Remove temporary signing keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/wovenmatter-release.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-private-key.p8" "$RUNNER_TEMP/sparkle-private-key"
