name: Release

# A maintainer Mac compiles the app (scripts/cut-release.sh) and uploads it to the
# private draft. This workflow only signs, notarizes and packages that app.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: desktop-release-publication
  cancel-in-progress: false

jobs:
  macos:
    name: Signed Apple Silicon release
    # Xcode 27.2, the toolchain the app is developed with (macos-26 stops at Xcode 26.6).
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      WOVENMATTER_SIGNING_IDENTITY: Developer ID Application
      WOVENMATTER_RELEASE_WORK_DIR: /private/tmp/wovenmatter-release-build
      WOVENMATTER_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/dist
    steps:
      # Signing secrets and release write access: exact current releases,
      # reviewed during dependency maintenance (docs/DEPENDENCIES.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify accepted release source
        id: source
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download the app compiled for this release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          input="$RUNNER_TEMP/input"
          gh release download "v$VERSION" --dir "$input" \
            --pattern WovenMatter-unsigned.zip --pattern unsigned-input.json
          jq -e --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
            --argjson build "$(git rev-list --count HEAD)" \
            --arg sha "$(shasum -a 256 "$input/WovenMatter-unsigned.zip" | cut -d' ' -f1)" \
            '.version == $version and .source_revision == $revision and .build == $build and .sha256 == $sha' \
            "$input/unsigned-input.json"

      - name: Import Developer ID identity
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/wovenmatter-release.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Prepare notarization key
        env:
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-private-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-private-key.p8"

      - name: Prepare update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"

      # One step per phase gives live step status and durations. Each phase
      # rechecks source/tag/cleanliness and refuses work from any other source,
      # version, build, failed phase or out-of-order phase. Secrets are scoped
      # to the phases that use them.
      - name: 'Release 1/6: import the compiled app'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_RELEASE_INPUT: ${{ runner.temp }}/input/WovenMatter-unsigned.zip
        run: scripts/build-release.sh "$VERSION" import

      - name: 'Release 2/6: sign with Developer ID, seal and validate app'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: scripts/build-release.sh "$VERSION" seal

      - name: 'Release 3/6: notarize, staple and assess app'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_NOTARY_KEY: ${{ runner.temp }}/notary-private-key.p8
          WOVENMATTER_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          WOVENMATTER_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/build-release.sh "$VERSION" notarize-app

      - name: 'Release 4/6: create and sign disk image'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: scripts/build-release.sh "$VERSION" package

      - name: 'Release 5/6: notarize, staple and assess disk image'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_NOTARY_KEY: ${{ runner.temp }}/notary-private-key.p8
          WOVENMATTER_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          WOVENMATTER_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/build-release.sh "$VERSION" notarize-dmg

      - name: 'Release 6/6: signed full-only feed, checksums, reconstruction'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_SPARKLE_PRIVATE_KEY: ${{ runner.temp }}/sparkle-private-key
        run: scripts/build-release.sh "$VERSION" feed

      - name: Record release phase timings
        if: always()
        run: |
          timings="$WOVENMATTER_RELEASE_WORK_DIR/release-timings.jsonl"
          if [ -f "$timings" ]; then cat "$timings"; fi

      - name: Upload signed artifacts to the private draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          gh release delete-asset "v$VERSION" WovenMatter-unsigned.zip --yes
          gh release delete-asset "v$VERSION" unsigned-input.json --yes
          python3 scripts/stage-update.py dist "$VERSION"

      - name: Remove temporary signing keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/wovenmatter-release.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-private-key.p8" "$RUNNER_TEMP/sparkle-private-key"
