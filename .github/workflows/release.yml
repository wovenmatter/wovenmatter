name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Signed Apple Silicon release
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify immutable release source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          scripts/scan-public-tree.sh
          scripts/test-release.sh

      - name: Run deterministic validation
        run: scripts/test-changes.sh --all

      - name: Import Developer ID identity
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/wovenmatter-release.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Prepare notarization key
        env:
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-private-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-private-key.p8"

      - name: Build, sign, notarize, and package
        env:
          WOVENMATTER_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WOVENMATTER_SIGNING_IDENTITY: Developer ID Application
          WOVENMATTER_NOTARY_KEY: ${{ runner.temp }}/notary-private-key.p8
          WOVENMATTER_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          WOVENMATTER_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          WOVENMATTER_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/build-release.sh "$version"

      - name: Create or refresh draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --draft \
              --title "Woven Matter v${version}" \
              --notes "Signed and notarized Apple Silicon release."
          fi

      - name: Remove temporary signing keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/wovenmatter-release.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-private-key.p8"
