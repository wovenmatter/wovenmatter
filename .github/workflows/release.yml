name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Rehearse every build, signing and notarization phase from a v-rehearsal-* tag without publishing
        type: boolean
        default: false
      refresh:
        description: Refresh the existing public release from an accepted immutable build tag
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-publication
  cancel-in-progress: false

# Every job runs on the owned runners (docs/CI_RUNNERS.md): wovenmatter-linux is
# Trey's workstation and wovenmatter-macos is his Mac mini. Their job guard admits
# only collaborator pushes and manual dispatches of this workflow and validation.
jobs:
  # PR CI never compiles the Linux library or the macOS app. A new version starts
  # only from source that passed manual linux and desktop validation, unless Trey
  # waived it in the tag message. Same-version update refreshes and rehearsals,
  # which publish nothing new, are exempt.
  preflight:
    name: Require validated release source
    runs-on: [self-hosted, wovenmatter-linux]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require passing linux and desktop validation
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh || false }}
          REHEARSAL: ${{ inputs.rehearsal || false }}
        run: |
          if [ "$REFRESH" = true ]; then
            echo 'Update refresh build: it reuses the released version and skips this gate.'
            exit 0
          fi
          if [ "$REHEARSAL" = true ]; then
            echo 'Rehearsal: nothing is published, so this gate does not apply.'
            exit 0
          fi
          scripts/check-release-validation.py --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" "$GITHUB_SHA"

  # The Mac builds without Docker: the static Linux library host binaries that host
  # releases ship are built on the workstation and handed over as an artifact.
  linux-library:
    needs: preflight
    name: Linux library binaries
    runs-on: [self-hosted, wovenmatter-linux]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Exact current releases: this workflow holds write tokens and signing
      # material (docs/DEPENDENCIES.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release-only caches: validation never writes what a release reads.
      - name: Use this runner's release caches
        run: scripts/ci-runner/cache-env.sh release >> "$GITHUB_ENV"
      # The pinned Swift image and Static Linux SDK (remote/library/build-version.json),
      # both architectures, gzip-packed beside each binary's SHA-256.
      - name: Build wovenmatter-library for x86_64 and aarch64
        run: scripts/build-linux-library.sh --docker
      - name: Verify the packed binaries
        run: scripts/verify-linux-library.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wovenmatter-library-linux
          path: remote/host/library/
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: linux-library
    name: Signed Apple Silicon release
    # The Xcode recorded in app/xcode-version.json, on the owned Mac.
    runs-on: [self-hosted, wovenmatter-macos]
    timeout-minutes: 120
    environment: release
    # Shared, non-secret phase settings.
    env:
      WOVENMATTER_SIGNING_IDENTITY: Developer ID Application
      WOVENMATTER_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/dist
      WOVENMATTER_RELEASE_ALLOW_UNTAGGED: ${{ (inputs.refresh || inputs.rehearsal) && '1' || '0' }}
    steps:
      # Signing secrets and release write access: exact current releases,
      # reviewed during dependency maintenance (docs/DEPENDENCIES.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the recorded Xcode
        run: scripts/check-xcode.sh
      # Release-only caches: validation never writes what a release reads, and
      # only release builds of accepted main source write them. Intermediates
      # start fresh in this job's temporary directory.
      - name: Use this runner's release caches
        run: |
          scripts/ci-runner/cache-env.sh release >> "$GITHUB_ENV"
          echo "WOVENMATTER_RELEASE_WORK_DIR=$RUNNER_TEMP/wovenmatter-release-build" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The bundled Node stable release, refreshed during dependency maintenance.
          node-version-file: default-agent/.node-version

      - name: Verify accepted release source
        id: source
        env:
          REFRESH: ${{ inputs.refresh || false }}
          REHEARSAL: ${{ inputs.rehearsal || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REHEARSAL" = true ]; then
            # Any reviewed commit, including an unmerged PR's; nothing is published.
            [[ "$GITHUB_REF" =~ ^refs/tags/v-rehearsal-[A-Za-z0-9._-]+$ ]]
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
            echo "version=0.0.1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "$REFRESH" = true ]; then
            scripts/verify-update-request.sh
            version="$(jq -er '.version' .github/release-refresh.json)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            build="$(git rev-list --count HEAD)"
            test "$GITHUB_REF_NAME" = "v${version}-build${build}"
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v$version"
            gh release view "v$version" --json isDraft --jq .isDraft | grep -qx false
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --jq '.immutable == false' | grep -qx true
          else
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
            version="${GITHUB_REF_NAME#v}"
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Before xcodebuild: the app bundles them in its host release sources.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wovenmatter-library-linux
          path: remote/host/library
      - name: Verify the Linux library binaries
        run: scripts/verify-linux-library.sh

      - name: Validate release metadata before compiling
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: python3 scripts/validate-release-metadata.py preflight "$VERSION" "$(git rev-list --count HEAD)" "$GITHUB_SHA"

      - name: Ensure CEF build tools
        run: command -v cmake >/dev/null || { echo '::error::Install cmake on this runner (brew install cmake).'; exit 1; }

      # The runner is the user's own login session: add the temporary keychain in
      # front of the user's keychains rather than replacing them, and require
      # exactly one Developer ID identity. The runner's job guard removes the
      # entry if this job is killed before its cleanup step.
      - name: Import Developer ID identity
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/wovenmatter-release.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          rm -f "$certificate"
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; line="${line%\"}"
            [ -z "$line" ] || [ "$line" = "$keychain" ] || existing+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" ${existing[@]+"${existing[@]}"}
          identities="$(security find-identity -v -p codesigning | grep -c 'Developer ID Application:' || true)"
          if [ "$identities" != 1 ]; then
            echo "::error::Expected one Developer ID Application identity in the search list, found $identities. Remove other copies from this Mac's keychains."
            exit 1
          fi

      - name: Prepare notarization key
        env:
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-private-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-private-key.p8"

      - name: Prepare update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"

      - name: Reuse verified private artifacts from an earlier attempt
        id: reuse
        env:
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_SPARKLE_PRIVATE_KEY: ${{ runner.temp }}/sparkle-private-key
          REFRESH: ${{ inputs.refresh || false }}
          REHEARSAL: ${{ inputs.rehearsal || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REHEARSAL" = true ]; then echo reused=false >> "$GITHUB_OUTPUT"; exit 0; fi
          restore=--restore-tagged
          if [ "$REFRESH" = true ]; then restore=--restore-staged; fi
          if python3 scripts/stage-update.py dist "$VERSION" "$restore"; then
            echo "Reusing the original verified private artifacts for this build."
            echo reused=true >> "$GITHUB_OUTPUT"
          else
            status=$?
            test "$status" -eq 3 || exit "$status"
            echo reused=false >> "$GITHUB_OUTPUT"
          fi

      # One step per phase gives live step status and durations. Each phase
      # rechecks source/tag/cleanliness and refuses work from any other source,
      # version, build, failed phase or out-of-order phase. Secrets are scoped
      # to the phases that use them.
      - name: 'Release 1/6: compile production app'
        if: steps.reuse.outputs.reused == 'false'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/build-release.sh "$VERSION" compile

      - name: 'Release 2/6: sign nested helpers, seal and validate app'
        if: steps.reuse.outputs.reused == 'false'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: scripts/build-release.sh "$VERSION" seal

      - name: 'Release 3/6: notarize, staple and assess app'
        if: steps.reuse.outputs.reused == 'false'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_NOTARY_KEY: ${{ runner.temp }}/notary-private-key.p8
          WOVENMATTER_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          WOVENMATTER_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/build-release.sh "$VERSION" notarize-app

      - name: 'Release 4/6: create and sign disk image'
        if: steps.reuse.outputs.reused == 'false'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: scripts/build-release.sh "$VERSION" package

      - name: 'Release 5/6: notarize, staple and assess disk image'
        if: steps.reuse.outputs.reused == 'false'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_NOTARY_KEY: ${{ runner.temp }}/notary-private-key.p8
          WOVENMATTER_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          WOVENMATTER_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/build-release.sh "$VERSION" notarize-dmg

      - name: 'Release 6/6: manifest, checksums, signed full-only feed, reconstruction'
        if: steps.reuse.outputs.reused == 'false'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_SPARKLE_PRIVATE_KEY: ${{ runner.temp }}/sparkle-private-key
        run: scripts/build-release.sh "$VERSION" feed

      - name: Record release phase timings
        if: always() && steps.reuse.outputs.reused == 'false'
        run: |
          timings="$WOVENMATTER_RELEASE_WORK_DIR/release-timings.jsonl"
          if [ -f "$timings" ]; then cat "$timings"; fi

      - name: Verify private draft and deliver authorized update refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh || false }}
          REHEARSAL: ${{ inputs.rehearsal || false }}
          VERSION: ${{ steps.source.outputs.version }}
          WOVENMATTER_SPARKLE_PRIVATE_KEY: ${{ runner.temp }}/sparkle-private-key
        run: |
          if [ "$REHEARSAL" = true ]; then
            # Every phase passed; keep no signed rehearsal artifacts on the runner.
            ls -l dist
            rm -rf dist
            echo 'Rehearsal passed every release phase. Nothing was published.'
            exit 0
          fi
          if [ "$REFRESH" != true ] && ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --title "Woven Matter v$VERSION" \
              --notes "Signed and notarized Apple Silicon release."
          fi
          options=()
          if [ "$REFRESH" = true ]; then options+=(--refresh); fi
          python3 scripts/stage-update.py dist "$VERSION" "${options[@]}"

      - name: Remove temporary signing keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/wovenmatter-release.keychain-db"
          security delete-keychain "$keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-private-key.p8" "$RUNNER_TEMP/sparkle-private-key"

