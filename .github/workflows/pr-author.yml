name: PR Author

on:
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    if: >-
      github.repository == 'wovenmatter/wovenmatter' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request && github.event.comment.body == '/recheck-author'))
    runs-on: ubuntu-24.04
    concurrency:
      group: pr-author-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Only GitHub metadata is read. Never check out or execute PR code in
      # this write-permission workflow, including on a comment recheck.
      - name: Classify PR author and apply review label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const repo = context.repo;
            let pullRequest = context.payload.pull_request;
            if (context.eventName === "issue_comment") {
              const { data } = await github.rest.pulls.get({
                ...repo,
                pull_number: context.payload.issue.number,
              });
              pullRequest = data;
            }

            const author = pullRequest.user?.login;
            const association = pullRequest.author_association;
            const organizationOwned = context.payload.repository.owner.type === "Organization";
            // MEMBER explicitly identifies a member of the owning organization.
            // OWNER is accepted only for this organization-owned repository.
            // Collaborator permissions, bot status and account names are not proof.
            let organizationMember = organizationOwned && Boolean(author) && ["MEMBER", "OWNER"].includes(association);
            if (organizationOwned && !organizationMember && author) {
              try {
                const response = await github.rest.orgs.checkPublicMembershipForUser({
                  org: repo.owner,
                  username: author,
                });
                organizationMember = response.status === 204;
              } catch (error) {
                // GITHUB_TOKEN has no organization Members permission. A 404
                // here means not PUBLICLY a member, not proof of non-membership.
                // Private or otherwise unverified membership gets heavier review.
                if (error.status !== 404) {
                  core.warning(`Public organization membership lookup unavailable (HTTP ${error.status ?? "unknown"}); retaining heavier review.`);
                }
              }
            }

            const definitions = {
              "author:organization": {
                color: "1f883d",
                description: "Author is a verified WovenMatter organization member; normal review gates still apply.",
              },
              "author:external-or-unverified": {
                color: "fbca04",
                description: "Outside author or organization membership unverified; review more heavily.",
              },
            };
            const desired = organizationMember
              ? "author:organization"
              : "author:external-or-unverified";

            try {
              await github.rest.issues.createLabel({
                ...repo,
                name: desired,
                ...definitions[desired],
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              await github.rest.issues.updateLabel({
                ...repo,
                name: desired,
                new_name: desired,
                ...definitions[desired],
              });
            }

            // Add the current flag before removing obsolete classification labels.
            await github.rest.issues.addLabels({
              ...repo,
              issue_number: pullRequest.number,
              labels: [desired],
            });
            const obsolete = new Set([
              "vouch:trusted", "vouch:unvouched", "vouch:denounced",
              "size:XS", "size:S", "size:M", "size:L", "size:XL", "size:XXL",
              ...Object.keys(definitions).filter((name) => name !== desired),
            ]);
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            for (const { name } of labels) {
              if (!obsolete.has(name)) continue;
              try {
                await github.rest.issues.removeLabel({
                  ...repo,
                  issue_number: pullRequest.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            core.info(`PR #${pullRequest.number}: ${desired} (author association: ${association ?? "unknown"}).`);
