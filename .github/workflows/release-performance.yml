name: Release cache validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release*.yml'
      - 'scripts/*release*'
      - 'scripts/*cache*'
      - 'scripts/prepare-browser.sh'
      - 'scripts/prepare-default-agent.sh'
      - 'scripts/prepare-sparkle-tools.sh'
permissions:
  contents: read
concurrency:
  group: release-cache-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  roundtrip:
    name: Cold and warm Release compilation
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Ensure CEF build tools
        run: command -v cmake >/dev/null || brew install cmake
      - name: Verify cold and warm builds
        shell: bash
        run: |
          set -euo pipefail
          export WOVENMATTER_COMPILER_CACHE="$RUNNER_TEMP/release-compiler-proof"
          export WOVENMATTER_COMPILER_BUILD_ROOT="$RUNNER_TEMP/release-build-proof"
          export WOVENMATTER_BROWSER_CACHE="$RUNNER_TEMP/browser-build-proof"
          export WOVENMATTER_WRITE_BROWSER_CACHE=1
          mkdir -p "$RUNNER_TEMP/release-proof-logs"
          for pass in cold warm; do
            # Exercise actual compiler-cache replay, not Xcode's incremental no-op.
            rm -rf "$WOVENMATTER_COMPILER_BUILD_ROOT/DerivedData"
            /usr/bin/time -p scripts/warm-release-compiler.sh 2>&1 | tee "$RUNNER_TEMP/release-proof-logs/$pass.log"
            app="$WOVENMATTER_COMPILER_BUILD_ROOT/DerivedData/Build/Products/Release/Woven Matter.app"
            python3 scripts/validate-release-metadata.py verify 0.0.0 1 "$(git rev-parse HEAD)" --plist "$app/Contents/Info.plist"
          done
          grep -Eiq 'cache hit|cache-hit' "$RUNNER_TEMP/release-proof-logs/warm.log"
      - name: Preserve timings and diagnostics
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: release-cache-proof
          path: ${{ runner.temp }}/release-proof-logs
          retention-days: 7
