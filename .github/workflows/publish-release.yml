name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing staged release tag, such as v0.1.2
        required: true
        type: string
      confirmation:
        description: Type "publish vX.Y.Z" using the exact tag above
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Trey publication approval
        env:
          TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_ACTOR" = "trey131"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$CONFIRMATION" = "publish $TAG"

      - name: Verify and publish staged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          test "$is_draft" = "true"

          expected="$(printf '%s\n' "SHA256SUMS.txt" "WovenMatter_${version}_arm64.dmg" "latest-mac.json" | sort)"
          actual="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          test "$actual" = "$expected"

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
