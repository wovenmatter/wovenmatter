name: Compare release compiler
on:
  workflow_call:
    inputs:
      base:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: compile-${{ matrix.order }}
    strategy:
      fail-fast: false
      matrix:
        order: [baseline-first, candidate-first]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Ensure CEF build tools
        run: command -v cmake >/dev/null || brew install cmake
      - name: Identify component cache keys
        id: inputs
        run: scripts/release-cache-key.sh >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; exact release for release caches
        with:
          path: ~/Library/Caches/WovenMatter/Downloads
          key: ${{ steps.inputs.outputs.downloads }}
          restore-keys: ${{ steps.inputs.outputs.downloads_fallback }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; exact release for release caches
        with:
          path: ~/Library/Caches/WovenMatter/BrowserBuilds
          key: ${{ steps.inputs.outputs.browser }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; exact release for release caches
        with:
          path: ~/Library/Caches/WovenMatter/SourcePackages/repositories
          key: ${{ steps.inputs.outputs.swiftpm }}
          restore-keys: ${{ steps.inputs.outputs.swiftpm_fallback }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; exact release for release caches
        with:
          path: ~/.npm
          key: ${{ steps.inputs.outputs.npm }}
          restore-keys: ${{ steps.inputs.outputs.npm_fallback }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; exact release for release caches
        with:
          path: ~/Library/Caches/WovenMatter/Compiler
          key: ${{ steps.inputs.outputs.compiler }}${{ github.sha }}
          restore-keys: |
            ${{ steps.inputs.outputs.compiler }}
            ${{ steps.inputs.outputs.compiler_fallback }}

      - name: Measure app-source compile
        env:
          COMPARE_BASE: ${{ inputs.base }}
          COMPARE_ORDER: ${{ matrix.order }}
        run: python3 scripts/benchmark-release-compile.py
      - uses: actions/upload-artifact@main
        if: always()
        with:
          name: compile-${{ matrix.order }}
          path: ${{ runner.temp }}/release-compile-paired
