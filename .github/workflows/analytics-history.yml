name: Analytics history
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      bootstrap_history:
        description: Complete history JSON for initial setup or recovery when no retained archive exists
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: analytics-history
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore complete previous history
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYTICS_REPOSITORY: ${{ github.repository }}
          ANALYTICS_BOOTSTRAP_HISTORY: ${{ inputs.bootstrap_history }}
        run: python3 scripts/restore-github-analytics.py --repository "$ANALYTICS_REPOSITORY" --output analytics-history/history.json
      - name: Collect aggregate traffic and downloads
        id: collection
        env:
          GH_TOKEN: ${{ secrets.ANALYTICS_GITHUB_TOKEN }}
          ANALYTICS_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Configure ANALYTICS_GITHUB_TOKEN with repository Administration read access; the default workflow token cannot read traffic." >&2
            exit 1
          fi
          python3 scripts/collect-github-analytics.py --repository "$ANALYTICS_REPOSITORY" --output analytics-history/history.json
      - name: Publish aggregate snapshots to PostHog
        env:
          # Public ingestion token already shipped in the app; no admin key.
          POSTHOG_PROJECT_TOKEN: phc_ukNR3Tu7AjaLmAVjbapvKsyaB8LdhFwM3vUjM5Jfxpeh
        run: python3 scripts/publish-github-analytics.py --history analytics-history/history.json
      - name: Preserve complete rolling history
        if: ${{ always() && steps.collection.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analytics-history
          path: analytics-history/history.json
          retention-days: 90
          if-no-files-found: error
