# Daily update proposals for dependencies Dependabot can maintain coherently.
# Every update type, majors included, is proposed; CI and review gate merges.
# scripts/update-runtime-dependencies.mjs (.github/workflows/dependency-refresh.yml)
# owns Node, CEF, Sparkle, Peekaboo, and the npm packages that generate the
# offline mobile resources. See docs/DEPENDENCIES.md.
version: 2
updates:
  # Updates the exact release SHAs in write-token workflows. Read-only CI and
  # analytics helpers track their upstream default branches instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /default-agent
    schedule:
      interval: daily
    versioning-strategy: increase
    ignore:
      # Regenerated with the iOS bundles and provenance by the refresh workflow.
      - dependency-name: '@earendil-works/*'
      - dependency-name: '@anthropic-ai/claude-agent-sdk'
      - dependency-name: esbuild
    groups:
      default-agent-minor-and-patch:
        update-types: [minor, patch]
