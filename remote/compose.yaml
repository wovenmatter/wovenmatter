name: wovenmatter

services:
  workspace:
    image: wovenmatter/workspace:latest
    build:
      context: ..
      dockerfile: remote/Dockerfile
    container_name: ${WOVENMATTER_CONTAINER_NAME:-wovenmatter-workspace}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    pids_limit: 512
    ulimits:
      core: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
      - /run:rw,noexec,nosuid,nodev,size=16m
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
    ports:
      - 127.0.0.1:${WOVENMATTER_HOST_PORT:-7337}:7337
    environment:
      WOVENMATTER_API_TOKEN: ${WOVENMATTER_API_TOKEN:?set WOVENMATTER_API_TOKEN}
    volumes:
      - workspace-home:/home

volumes:
  workspace-home:
    name: ${WOVENMATTER_VOLUME_NAME:-wovenmatter-workspace-home}

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.gateway_mode_ipv4: nat
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
      com.docker.network.bridge.trusted_host_interfaces: ""
