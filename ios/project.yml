name: WovenMatter
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  Mobile:
    path: .
  Shared:
    path: ../shared
targets:
  WovenMatter:
    productName: WovenMatter
    type: application
    platform: iOS
    sources:
      - path: Sources/MobileApp
      - path: ../app/App/Views/DashboardStyle.swift
      - path: ../app/App/Views/DashboardColors.swift
      - path: ../app/App/Models/ConversationMarkdownDocument.swift
      - path: ../app/App/Views/ConversationResponse.swift
      - path: ../app/App/Views/ConversationHTMLRenderView.swift
      - path: ../app/Sources/WovenMatterCore/ConversationHTMLRender.swift
      - path: ../app/Sources/WovenMatterCore/AgentRunActivity.swift
      - path: ../app/Sources/WovenMatterCore/AssistantTranscriptProjection.swift
      - path: ../app/Sources/WovenMatterCore/AssistantStreamingText.swift
      - path: ../app/Sources/WovenMatterCore/ConversationWorkTimeline.swift
      - path: ../app/Sources/WovenMatterCore/ProgramStatus.swift
      - path: ../app/Sources/WovenMatterCore/WorkspaceHistory.swift
      - path: ../app/App/Models/ConversationMessageLayout.swift
      - path: ../app/App/Models/ConversationTranscriptState.swift
      - path: ../app/App/Views/ConversationWorkTranscript.swift
      - path: ../app/App/Views/ConversationSubagentRow.swift
      - path: ../app/App/SharedAssets.xcassets
      - path: ../docs/assets/LUCIDE_LICENSE.txt
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Mobile
        product: LibraryClient
      - package: Mobile
        product: PiDurableRuntime
      - package: Mobile
        product: MobileInference
      - package: Shared
        product: WovenMatterShared
    settings:
      base:
        PRODUCT_NAME: WovenMatter
        PRODUCT_MODULE_NAME: WovenMatterMobileApp
        DEVELOPMENT_TEAM: 3M84Q9NAMN
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Config/Info.plist
        MARKETING_VERSION: 0.0.1
        # Dev default only. TestFlight archives stamp a UTC build number;
        # see scripts/prepare-ios-testflight.sh.
        CURRENT_PROJECT_VERSION: 18
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Debug is the simulator/local-device Dev app; Release is the TestFlight app.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.wovenmatter.dev
          WOVENMATTER_DISPLAY_NAME: Woven Matter Dev
          # Its own link scheme, so a pairing link opened outside the app goes to the TestFlight app.
          WOVENMATTER_URL_SCHEME: wovenmatter-dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.wovenmatter
          WOVENMATTER_DISPLAY_NAME: Woven Matter
          WOVENMATTER_URL_SCHEME: wovenmatter
  MobileAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MobileAppTests
    dependencies:
      - target: WovenMatter
      - package: Mobile
        product: LibraryClient
        link: false
      - package: Shared
        product: WovenMatterShared
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.wovenmatter.dev.apptests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WovenMatter.app/WovenMatter
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  MobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MobileUITests
    dependencies:
      - target: WovenMatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.wovenmatter.dev.uitests
        DEVELOPMENT_TEAM: 3M84Q9NAMN
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WovenMatter:
    build:
      targets:
        WovenMatter: all
    test:
      targets:
        - MobileAppTests
        - MobileUITests
