name: WovenMatterCompanion
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  Mobile:
    path: .
  Shared:
    path: ../shared
targets:
  WovenMatterMobileApp:
    productName: WovenMatterCompanion
    type: application
    platform: iOS
    sources:
      - path: Sources/CompanionApp
      - path: Config/PrivacyInfo.xcprivacy
      - path: ../app/App/Views/DashboardStyle.swift
      - path: ../app/App/Views/DashboardColors.swift
      - path: ../app/App/Models/ConversationMarkdownDocument.swift
      - path: ../app/App/Views/ConversationResponse.swift
      - path: ../app/App/Views/ConversationHTMLRenderView.swift
      - path: ../app/Sources/WovenMatterCore/ConversationHTMLRender.swift
      - path: ../app/Sources/WovenMatterCore/AgentRunActivity.swift
      - path: ../app/Sources/WovenMatterCore/AssistantTranscriptProjection.swift
      - path: ../app/Sources/WovenMatterCore/AssistantStreamingText.swift
      - path: ../app/Sources/WovenMatterCore/ConversationWorkTimeline.swift
      - path: ../app/Sources/WovenMatterCore/ProgramStatus.swift
      - path: ../app/Sources/WovenMatterCore/WorkspaceHistory.swift
      - path: ../app/App/Models/ConversationMessageLayout.swift
      - path: ../app/App/Models/ConversationTranscriptState.swift
      - path: ../app/App/Views/ConversationWorkTranscript.swift
      - path: ../app/App/Views/ConversationSubagentRow.swift
      - path: ../app/App/SharedAssets.xcassets
    dependencies:
      - package: Mobile
        product: CompanionClient
      - package: Mobile
        product: PiDurableRuntime
      - package: Mobile
        product: CompanionInference
      - package: Shared
        product: WovenMatterCompanion
    settings:
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.companion.dev
          WOVENMATTER_DISPLAY_NAME: Woven Matter Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.companion
          WOVENMATTER_DISPLAY_NAME: Woven Matter
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.companion.dev
        PRODUCT_NAME: WovenMatterCompanion
        PRODUCT_MODULE_NAME: WovenMatterMobileApp
        DEVELOPMENT_TEAM: 3M84Q9NAMN
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Config/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 18
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CompanionAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CompanionAppTests
    dependencies:
      - target: WovenMatterMobileApp
      - package: Mobile
        product: CompanionClient
        link: false
      - package: Shared
        product: WovenMatterCompanion
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.companion.dev.apptests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WovenMatterCompanion.app/WovenMatterCompanion
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  CompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CompanionUITests
    dependencies:
      - target: WovenMatterMobileApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.companion.dev.uitests
        DEVELOPMENT_TEAM: 3M84Q9NAMN
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WovenMatterCompanion:
    build:
      targets:
        WovenMatterMobileApp: all
    test:
      targets:
        - CompanionAppTests
        - CompanionUITests
