name: WovenMatter
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  Mobile:
    path: .
  Protocol:
    path: ../protocol
targets:
  WovenMatter:
    productName: WovenMatter
    type: application
    platform: iOS
    # The app's version is the Woven Matter app's: one file for the Mac and
    # this app. A release build passes MARKETING_VERSION for both.
    configFiles:
      Debug: ../app/Version.xcconfig
      Release: ../app/Version.xcconfig
    sources:
      - path: Sources/MobileApp
      # The Mac UI's client layer: the stores, connections and presentation
      # types. Its Mac-only corners stay out.
      - path: ../app/App/Client
        excludes:
          - Connection/ThisMachineServer.swift
          - UpdatesStore.swift
          - UIToolsStore.swift
      - path: ../app/App/Platform/DictationSession.swift
      - path: ../app/App/Platform/AppleDictationEngine.swift
      - path: ../app/App/Platform/DictationInsertion.swift
      - path: ../app/App/Platform/DictationRecord.swift
      - path: ../app/App/Platform/DictationTranscript.swift
      - path: ../app/App/Views/WovenStyle.swift
      - path: ../app/App/Views/WovenColors.swift
      - path: ../app/App/Views/ConversationResponse.swift
      - path: ../app/App/Views/ConversationWorkTranscript.swift
      - path: ../app/App/Views/ConversationHTMLRenderView.swift
      - path: ../app/App/Views/ConversationRunningDots.swift
      - path: ../app/App/Views/ConversationMarkdown.swift
      - path: ../app/App/Views/ConversationSubagentRow.swift
      - path: ../app/App/Views/ConversationMessageRow.swift
      - path: ../app/App/Views/RemoteInteractionCard.swift
      - path: ../app/App/Views/WorkspaceSessionActivity.swift
      - path: ../app/App/SharedAssets.xcassets
      - path: ../docs/assets/LUCIDE_LICENSE.txt
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Mobile
        product: WovenDevice
      - package: Protocol
        product: WovenProtocol
    settings:
      base:
        PRODUCT_NAME: WovenMatter
        PRODUCT_MODULE_NAME: WovenMatterMobileApp
        DEVELOPMENT_TEAM: 3M84Q9NAMN
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Config/Info.plist
        # Dev default only. TestFlight archives stamp a UTC build number;
        # see scripts/prepare-ios-testflight.sh.
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
      # Debug is the simulator/local-device Dev app; Release is the TestFlight app.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.wovenmatter.dev
          WOVENMATTER_DISPLAY_NAME: Woven Matter Dev
          # Its own link scheme, so a connection link opened outside the app goes to the TestFlight app.
          WOVENMATTER_URL_SCHEME: wovenmatter-dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.wovenmatter
          WOVENMATTER_DISPLAY_NAME: Woven Matter
          WOVENMATTER_URL_SCHEME: wovenmatter
  MobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MobileUITests
    dependencies:
      - target: WovenMatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wovenmatter.wovenmatter.dev.uitests
        DEVELOPMENT_TEAM: 3M84Q9NAMN
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WovenMatter:
    build:
      targets:
        WovenMatter: all
    test:
      targets:
        - MobileUITests
